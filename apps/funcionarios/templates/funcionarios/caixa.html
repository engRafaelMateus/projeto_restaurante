{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caixa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custon2.css' %}">
    <style>
        .mesa { cursor:pointer; user-select:none; border-radius:8px; padding:18px; text-align:center; margin:6px; transition: 0.2s; }
        .mesa.livre { background:#d4edda; border:1px solid #c3e6cb; }
        .mesa.ocupada { background:#f8d7da; border:1px solid #f5c6cb; }
        .mesa-num { font-weight:700; font-size:1.25rem; }
        .mesa-total { font-size:0.9rem; margin-top:6px; }
        .mesas-grid { display:flex; flex-wrap:wrap; gap:8px; }
        .mesa { width:calc(10% - 10px); min-width:110px; }
        @media(max-width:900px){ .mesa{ width:calc(25% - 10px);} }
    </style>
</head>
<body>
<header class="d-flex justify-content-between align-items-center p-3 border-bottom">
    <div>
        <h4 class="mb-0">Caixa</h4>
        <small>Usuário: {{ request.user.get_full_name|default:request.user.username }}</small>
    </div>
    <div>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-secondary">Sair</button>
        </form>
    </div>
</header>

<main class="container my-4">
    <p>Duplo clique em uma mesa para ver detalhes.</p>
    <div id="mesas" class="mesas-grid">
        {% for mesa in mesas %}
        <div class="mesa" data-num="{{ mesa.numero }}" data-mesa-id="{{ mesa.id }}">
            <img src="{% static 'img/icon_table.png' %}" alt="" sizes="" srcset="">
            <div class="mesa-num">{{ mesa.numero }}</div>
            <div class="mesa-status small text-muted">{{ mesa.get_status_display }}</div>
            <div class="mesa-total small"></div>
        </div>
        {% endfor %}
    </div>
</main>

<!-- Offcanvas lateral -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasPedido" aria-labelledby="offcanvasPedidoLabel">
    <div class="offcanvas-header">
        <h5 id="offcanvasPedidoLabel">Detalhes Mesa</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <div id="detalhesMesa"></div>
        <div class="mt-3 d-flex justify-content-between">
            <button id="btnFecharMesa" class="btn btn-danger">Fechar Mesa</button>
            <button id="btnAdicionarItem" class="btn btn-primary">Adicionar Item (manual)</button>
        </div>
    </div>
</div>

<script>
    const pedidosMap = {{ pedidos_map_json|default:"{}"|safe }};
    document.addEventListener('DOMContentLoaded', function(){
        const mesas = document.querySelectorAll('.mesa');
        const offcanvasEl = document.getElementById('offcanvasPedido');
        const off = new bootstrap.Offcanvas(offcanvasEl);
        const detalhesDiv = document.getElementById('detalhesMesa');

        function refreshMesas(){
        mesas.forEach(m => {
            const num = m.dataset.num;
            const statusDiv = m.querySelector('.mesa-status'); // adiciona esta linha
            if(pedidosMap[num]){
                m.classList.add('ocupada'); m.classList.remove('livre');
                m.querySelector('.mesa-total').textContent = 'R$ ' + Number(pedidosMap[num].total||0).toFixed(2);
                if(statusDiv) statusDiv.textContent = 'Ocupada';  // atualiza o texto
            } else {
                m.classList.add('livre'); m.classList.remove('ocupada');
                m.querySelector('.mesa-total').textContent = '';
                if(statusDiv) statusDiv.textContent = 'Livre';  // atualiza o texto
            }
        });
    }
        refreshMesas();

        mesas.forEach(m => {
            m.addEventListener('dblclick', function(){
                const num = this.dataset.num;
                populateOffcanvas(num, pedidosMap[num]);
                off.show();
            });
        });

        function populateOffcanvas(num, info){
            detalhesDiv.innerHTML = '';
            const title = document.createElement('h5');
            title.textContent = 'Mesa ' + num;
            detalhesDiv.appendChild(title);

            const btnFechar = document.getElementById('btnFecharMesa');
            const btnAdicionar = document.getElementById('btnAdicionarItem');

            if(!info){
                const p = document.createElement('p');
                p.textContent = 'Mesa livre (sem itens lançados).';
                detalhesDiv.appendChild(p);
                btnFechar.disabled = true;
                btnAdicionar.dataset.mesaNum = num;
                return;
            }

            btnFechar.disabled = false;

            const table = document.createElement('div');
            table.innerHTML = '<div class="mb-2"><strong>Itens:</strong></div>';
            info.itens.forEach(it => {
                const row = document.createElement('div');
                row.className = 'd-flex justify-content-between border-bottom py-1';
                row.innerHTML = `<div>${it.nome}<br><small class="text-muted">qtd: ${it.qtd}</small></div>
                                 <div>R$ ${Number(it.subtotal|| (it.qtd*it.preco) || it.preco || 0).toFixed(2)}</div>`;
                table.appendChild(row);
            });
            detalhesDiv.appendChild(table);

            const tot = document.createElement('div');
            tot.className = 'mt-3 text-end';
            tot.innerHTML = `<strong>TOTAL: R$ ${Number(info.total||0).toFixed(2)}</strong>`;
            detalhesDiv.appendChild(tot);

            btnFechar.dataset.pedidoId = info.pedido_id || '';
            btnAdicionar.dataset.mesaNum = num;
        }

        document.getElementById('btnFecharMesa').addEventListener('click', function(){
            const pedidoId = this.dataset.pedidoId;
            if(!pedidoId){ alert('Nenhum pedido para fechar.'); return; }
            if(!confirm('Confirma fechamento da mesa?')) return;

            fetch(`/funcionarios/api/fechar_pedido/${pedidoId}/`, {
                method:'POST',
                headers:{'Content-Type':'application/json','X-CSRFToken': getCookie('csrftoken')},
                body: JSON.stringify({})
            }).then(r=>{
                if(r.ok){
                    for(const num in pedidosMap){
                        if(pedidosMap[num].pedido_id == pedidoId){
                            delete pedidosMap[num]; break;
                        }
                    }
                    refreshMesas();
                    off.hide();
                    alert('Mesa fechada com sucesso.');
                } else alert('Erro ao fechar pedido.');
            }).catch(e=>{console.error(e); alert('Erro ao fechar pedido.');});
        });

        function getCookie(name){
            let cookieValue = null;
            if(document.cookie && document.cookie !== ''){
                document.cookie.split(';').forEach(c=>{
                    const cookie = c.trim();
                    if(cookie.startsWith(name+'=')) cookieValue = decodeURIComponent(cookie.substring(name.length+1));
                });
            }
            return cookieValue;
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
