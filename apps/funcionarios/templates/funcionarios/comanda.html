{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Comanda - Garçom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="{% static 'css/main.css' %}" type="text/css" rel="stylesheet"/>
</head>
<body>
<div id="func-comanda" class="container">
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom">
        <div>
            <h1 class="mb-0">Comanda - {{ request.user.get_full_name|default:request.user.username }}</h1>
        </div>
        <div>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-secondary">Sair</button>
            </form>
        </div>
    </header>

    <!-- Mesa -->
    <div class="my-3 d-flex flex-column flex-sm-row align-items-stretch gap-2">
        <input type="number" class="form-control flex-grow-1" id="inputMesa" placeholder="Número da Mesa">
        <div class="d-flex gap-2">
            <button class="btn btn-secondary flex-grow-1" id="btnLimparMesa">Limpar</button>
            <button class="btn btn-success flex-grow-1" id="btnAbrirMesa">Abrir Mesa</button>
        </div>
    </div>

    <!-- Categorias -->
    <div id="func-categorias" class="mb-3 d-flex flex-wrap gap-2"></div>

    <div id="lista-itens-container"></div>
</div>

<!-- Resumo fixo -->
<div id="pedido-resumo-fixo" class="p-3 border-top">
    <div id="pedido-resumo"><p>Pedido vazio</p></div>
    <button class="btn btn-primary w-100 mt-2" id="btnEnviarPedido" disabled>Enviar Pedido</button>
</div>

<!-- Modal Itens -->
<div class="modal fade" id="modalItens" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Selecionar Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <!-- Lista de itens principais -->
                <div id="listaItens" class="d-flex flex-column gap-2 mb-3"></div>

                <!-- Subitens / adicionais -->
                <div id="subitens-wrapper" class="mb-3"></div>

                <!-- Spinner de quantidade e valor -->
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <small class="text-muted">Quantidade</small>
                        <div id="global-spinner" class="func-spinner mt-1">
                            <button type="button" class="btn btn-outline-secondary btn-decrease">−</button>
                            <input type="number" min="1" value="1" class="form-control form-control-sm"
                                   id="inputQuantidade" style="width:70px;">
                            <button type="button" class="btn btn-outline-secondary btn-increase">+</button>
                        </div>
                    </div>
                    <div class="text-end">
                        <div class="text-muted">Valor unitário</div>
                        <div id="modal-valor" class="func-price-summary">R$ 0,00</div>
                    </div>
                </div>

                <!-- Observações -->
                <div class="mt-3">
                    <textarea class="form-control" id="itemObservacao" placeholder="Observações"></textarea>
                </div>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <button class="btn btn-success" id="btnLancarItem">Lançar Item</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    (() => {
        let mesaAtual = null;
        let pedidoAtual = [];
        let pedidoId = null;
        let itensNovos = [];
        let selectedMain = null;
        let modalInstance = null;
        let pizzaHalf = null;
        let firstHalf = null;

        const inputMesa = document.getElementById('inputMesa');
        const btnAbrirMesa = document.getElementById('btnAbrirMesa');
        const btnLimparMesa = document.getElementById('btnLimparMesa');
        const categoriasContainer = document.getElementById('func-categorias');
        const pedidoDiv = document.getElementById('pedido-resumo');
        const btnEnviarPedido = document.getElementById('btnEnviarPedido');
        const modalEl = document.getElementById('modalItens');
        modalInstance = new bootstrap.Modal(modalEl);
        const listaItens = document.getElementById('listaItens');
        const subitensWrapper = document.getElementById('subitens-wrapper');
        const inputQuantidade = document.getElementById('inputQuantidade');
        const btnIncrease = modalEl.querySelector('.btn-increase');
        const btnDecrease = modalEl.querySelector('.btn-decrease');
        const modalValor = document.getElementById('modal-valor');
        const itemObservacao = document.getElementById('itemObservacao');
        const btnLancarItem = document.getElementById('btnLancarItem');

        // Campo de busca no modal
        const buscaWrapper = document.createElement('div');
        buscaWrapper.className = 'd-flex align-items-center mb-2 gap-2';
        const inputBuscaSabor = document.createElement('input');
        inputBuscaSabor.type = 'text';
        inputBuscaSabor.id = 'inputBuscaSabor';
        inputBuscaSabor.className = 'form-control';
        inputBuscaSabor.placeholder = 'Buscar sabor...';
        const btnApagarBusca = document.createElement('button');
        btnApagarBusca.type = 'button';
        btnApagarBusca.className = 'btn btn-outline-danger';
        btnApagarBusca.textContent = 'Apagar';
        btnApagarBusca.style.whiteSpace = 'nowrap';
        btnApagarBusca.addEventListener('click', () => {
            inputBuscaSabor.value = '';
            listaItens.querySelectorAll('.func-item-row').forEach(row => row.style.display = '');
            inputBuscaSabor.focus();
        });
        buscaWrapper.appendChild(inputBuscaSabor);
        buscaWrapper.appendChild(btnApagarBusca);
        modalEl.querySelector('.modal-body').insertBefore(buscaWrapper, listaItens);
        inputBuscaSabor.addEventListener('input', () => {
            const termo = inputBuscaSabor.value.toLowerCase();
            listaItens.querySelectorAll('.func-item-row').forEach(row => {
                const nome = row.querySelector('.fw-bold').textContent.toLowerCase();
                row.style.display = nome.includes(termo) ? '' : 'none';
            });
        });

        function money(v){ return 'R$ '+Number(v).toFixed(2).replace('.', ','); }
        function getItemPriceField(item){ return (item.valor!==undefined)?Number(item.valor):((item.preco!==undefined)?Number(item.preco):0); }

        // ✅ ATUALIZAR RESUMO COM LIXEIRA
        function atualizarResumo() {
            pedidoDiv.innerHTML = '';
            if (!pedidoAtual.length) {
                pedidoDiv.innerHTML = '<p>Pedido vazio</p>';
                btnEnviarPedido.disabled = true;
                return;
            }
            pedidoAtual.forEach((it, index) => {
                const row = document.createElement('div');
                row.className = 'border-bottom py-2 d-flex justify-content-between align-items-start';

                const infoDiv = document.createElement('div');
                const qtd = it.qtd||1;
                const valorUnit = Number(it.valor||it.preco||0);
                infoDiv.innerHTML = `<strong>${it.nome}</strong> x${qtd} - ${money(valorUnit*qtd)}`;
                if(it.adicionais && it.adicionais.length){
                    const subs = it.adicionais.map(a=>`+ ${a.nome}`).join('<br>');
                    infoDiv.innerHTML += `<br>${subs}`;
                }
                if(it.observacao) infoDiv.innerHTML += `<br><em>Observação: ${it.observacao}</em>`;
                row.appendChild(infoDiv);

                // 🔥 Botão de lixeira
                const delBtn = document.createElement('button');
                delBtn.className = 'btn btn-sm btn-outline-danger ms-2';
                delBtn.innerHTML = '<i class="bi bi-trash"></i>';
                delBtn.title = 'Remover item';
                delBtn.addEventListener('click', () => {
                    if(confirm('Remover este item do pedido?')){
                        pedidoAtual.splice(index, 1);
                        itensNovos.splice(index, 1);
                        atualizarResumo();
                    }
                });
                row.appendChild(delBtn);

                pedidoDiv.appendChild(row);
            });

            const total = pedidoAtual.reduce((acc,it)=>acc+(Number(it.valor||it.preco||0)*(it.qtd||1)),0);
            const totalDiv = document.createElement('div');
            totalDiv.className='fw-bold mt-2';
            totalDiv.textContent=`Total: ${money(total)}`;
            pedidoDiv.appendChild(totalDiv);
            btnEnviarPedido.disabled = itensNovos.length===0;
        }

        btnLimparMesa.addEventListener('click', ()=>{
            inputMesa.value=''; mesaAtual=null; pedidoAtual=[]; itensNovos=[]; pedidoId=null; selectedMain=null; pizzaHalf=null; firstHalf=null;
            atualizarResumo(); categoriasContainer.innerHTML=''; listaItens.innerHTML=''; subitensWrapper.innerHTML='';
        });

        btnAbrirMesa.addEventListener('click', async ()=>{
            const numero = String(inputMesa.value||'').trim();
            if(!numero){ alert('Digite o número da mesa!'); return; }
            mesaAtual = numero;
            try{
                const res = await fetch(`/funcionarios/api/pedido_aberto/${encodeURIComponent(mesaAtual)}/`);
                if(res.ok){
                    const data = await res.json();
                    pedidoId = data?.pedido_id||null;
                    pedidoAtual = data?.itens||[];
                }else{ pedidoAtual=[]; pedidoId=null; }
            }catch(e){ console.warn('pedido_aberto erro', e); pedidoAtual=[]; pedidoId=null; }
            itensNovos=[];
            atualizarResumo();

            try{
                const catRes = await fetch('/funcionarios/api/listar_categorias/');
                if(!catRes.ok) throw new Error('Erro listar categorias');
                const cdata = await catRes.json();
                ativarCategorias(cdata.categorias||[]);
            }catch(e){ console.error(e); alert('Erro ao carregar categorias'); }
        });

        function ativarCategorias(categorias){
            categoriasContainer.innerHTML='';
            categorias.forEach(cat=>{
                const btn = document.createElement('button');
                btn.type='button'; btn.className='btn btn-primary'; btn.textContent=cat.nome;
                btn.addEventListener('click',()=>abrirCategoria(cat.id, cat.nome));
                categoriasContainer.appendChild(btn);
            });
        }

        async function abrirCategoria(categoriaId, nome){
            try{
                const res = await fetch(`/funcionarios/api/listar_itens/${categoriaId}/`);
                if(!res.ok){ alert('Erro ao buscar itens da categoria'); return; }
                const data = await res.json();
                const itensPrincipais = Array.isArray(data.itens)?data.itens:data;
                const subcategorias = data.subcategorias||[];

                listaItens.innerHTML=''; subitensWrapper.innerHTML=''; selectedMain=null;
                inputQuantidade.value=1; itemObservacao.value=''; modalValor.textContent=money(0); inputBuscaSabor.value='';

                pizzaHalf = (nome.toLowerCase()==='pizza')?'first':null;
                firstHalf = null;
                atualizarTituloModal();
                let clickLock=false;

                itensPrincipais.forEach((it,idx)=>{
                    const row=document.createElement('label');
                    row.className='func-item-row';
                    row.setAttribute('data-id', it.id);
                    row.innerHTML=`
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <div class="fw-bold">${it.nome}</div>
                                <div class="text-muted small">${money(getItemPriceField(it))}</div>
                            </div>
                            <input type="radio" name="func-main-item" class="form-check-input me-2 func-main-radio" data-idx="${idx}">
                        </div>
                    `;
                    row.addEventListener('click',(ev)=>{
                        if(clickLock) return;
                        clickLock=true; setTimeout(()=>clickLock=false,50);
                        const radio=row.querySelector('.func-main-radio');
                        radio.checked=true;

                        if(pizzaHalf){
                            if(pizzaHalf==='first'){ firstHalf=it; pizzaHalf='second'; atualizarTituloModal(); }
                            else if(pizzaHalf==='second'){
                                selectedMain={
                                    id:null,
                                    nome:`${firstHalf.nome} / ${it.nome}`,
                                    sabores:[firstHalf,it],
                                    valor:(getItemPriceField(firstHalf)+getItemPriceField(it))/2
                                };
                                pizzaHalf=null; firstHalf=null; atualizarTituloModal(); atualizarModalValor();
                            }
                            return;
                        }
                        selectedMain=it;
                        atualizarModalValor();
                    });
                    listaItens.appendChild(row);
                });

                // Subcategorias
                if(subcategorias.length){
                    const subTitle=document.createElement('div');
                    subTitle.className='fw-bold mb-2'; subTitle.textContent='Subitens / Adicionais';
                    subitensWrapper.appendChild(subTitle);
                    subcategorias.forEach(sub=>{
                        const subHeader=document.createElement('div');
                        subHeader.className='mt-3 mb-2 fw-semibold';
                        subHeader.textContent=sub.nome;
                        subitensWrapper.appendChild(subHeader);
                        sub.itens.forEach(item=>{
                            const subRow=document.createElement('div');
                            subRow.className='func-item-row d-flex align-items-center justify-content-between p-2 rounded shadow-sm mb-2';
                            subRow.style.cursor='pointer'; subRow.style.backgroundColor='#f8f9fa'; subRow.style.border='1px solid #ddd'; subRow.style.transition='0.2s';
                            subRow.innerHTML=`
                                <div>
                                    <div class="fw-bold">${item.nome}</div>
                                    <div class="text-muted small">+ ${money(item.valor||0)}</div>
                                </div>
                                <input class="form-check-input me-2" type="checkbox" value="${item.id}" id="sub-${item.id}" data-valor="${item.valor||0}">
                            `;
                            subRow.addEventListener('click',(e)=>{
                                const cb=subRow.querySelector('input[type="checkbox"]');
                                if(e.target!==cb) cb.checked=!cb.checked;
                                atualizarModalValor();
                            });
                            subRow.addEventListener('mouseenter',()=>{ subRow.style.backgroundColor='#e9ecef'; subRow.style.boxShadow='0 2px 6px rgba(0,0,0,0.08)'; });
                            subRow.addEventListener('mouseleave',()=>{ subRow.style.backgroundColor='#f8f9fa'; subRow.style.boxShadow='none'; });
                            subitensWrapper.appendChild(subRow);
                        });
                    });
                }

                function atualizarModalValor(){
                    const qtd = parseInt(inputQuantidade.value, 10) || 1;
                    let valorBase = selectedMain ? (selectedMain.valor !== undefined ? selectedMain.valor : getItemPriceField(selectedMain)) : 0;
                    const adicionais = Array.from(subitensWrapper.querySelectorAll('input[type="checkbox"]:checked')).reduce((acc, el) => acc + (Number(el.dataset.valor) || 0), 0);
                    const total = (valorBase + adicionais) * qtd;
                    modalValor.textContent = money(total);
                }

                modalInstance.show();
            }catch(e){ console.error(e); alert('Erro ao abrir categoria'); }
        }

        // Spinner quantidade
        inputQuantidade.addEventListener('input', () => {
            let val = parseInt(inputQuantidade.value, 10);
            if (isNaN(val) || val < 1) val = 1;
            inputQuantidade.value = val;
            atualizarModalValor();
        });
        btnIncrease.addEventListener('click', () => {
            inputQuantidade.value = (parseInt(inputQuantidade.value, 10) || 1) + 1;
            atualizarModalValor();
        });
        btnDecrease.addEventListener('click', () => {
            let val = parseInt(inputQuantidade.value, 10) || 1;
            if (val > 1) val--;
            inputQuantidade.value = val;
            atualizarModalValor();
        });

        function atualizarTituloModal(){
            const titulo=modalEl.querySelector('.modal-title');
            if(pizzaHalf==='first') titulo.textContent='Primeira metade da Pizza';
            else if(pizzaHalf==='second') titulo.textContent='Segunda metade da Pizza';
            else titulo.textContent='Selecionar Item';
        }

        btnLancarItem.addEventListener('click',()=>{
            if(!selectedMain){ alert('Selecione um item'); return; }
            const selecionados=Array.from(subitensWrapper.querySelectorAll('input[type="checkbox"]:checked'))
                .map(el=>{
                    const nome=el.closest('.func-item-row').querySelector('.fw-bold').textContent;
                    return { id:el.value, nome:nome, valor:Number(el.dataset.valor)||0 };
                });
            const novoItem={
                origem_id:selectedMain.id,
                nome:selectedMain.nome,
                qtd:Number(inputQuantidade.value||1),
                valor:(selectedMain.valor||getItemPriceField(selectedMain))+selecionados.reduce((a,b)=>a+b.valor,0),
                observacao:itemObservacao.value.trim(),
                adicionais:selecionados
            };
            pedidoAtual.push(novoItem);
            itensNovos.push(novoItem);
            modalInstance.hide();
            selectedMain=null;
            atualizarResumo();
        });

        modalEl.addEventListener('hidden.bs.modal', () => {
            inputQuantidade.value = 1;
            modalValor.textContent = 'R$ 0,00';
            itemObservacao.value = '';
            subitensWrapper.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            selectedMain = null;
            pizzaHalf = null;
            firstHalf = null;
            const inputBusca = document.getElementById('inputBuscaSabor');
            if (inputBusca) inputBusca.value = '';
        });
    })();
</script>


</body>
</html>
