{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Comanda - Garçom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" type="text/css" rel="stylesheet"/>
</head>
<body>
<header class="d-flex justify-content-between align-items-center p-3 border-bottom">
    <div>
        <h1 class="mb-3 text-center">Comanda - Garçom</h1>
        <small>Usuário: {{ request.user.get_full_name|default:request.user.username }}</small>
    </div>
    <div>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-secondary">Sair</button>
        </form>
    </div>
</header>

<div class="container">

    <!-- Mesa -->
    <div class="mb-3 d-flex flex-column flex-sm-row align-items-stretch gap-2">
        <input type="number" class="form-control flex-grow-1" id="inputMesa" placeholder="Número da Mesa">
        <div class="d-flex gap-2">
            <button class="btn btn-secondary flex-grow-1" id="btnLimparMesa">Limpar</button>
            <!-- OBS: 'Abrir Mesa' agora NÃO cria nada no banco. Só carrega pedido existente (se houver) -->
            <button class="btn btn-success flex-grow-1" id="btnAbrirMesa">Abrir Mesa</button>
        </div>
    </div>

    <!-- Categorias -->
    <div id="categorias-container" class="mb-3 d-flex flex-wrap gap-2 justify-content-start"></div>

    <!-- Lista de Itens / Modal -->
    <div id="lista-itens-container"></div>
</div>

<!-- Resumo fixo -->
<div id="pedido-resumo-fixo" class="p-3 border-top">
    <div id="pedido-resumo"><p>Pedido vazio</p></div>
    <button class="btn btn-primary w-100 mt-2" id="btnEnviarPedido" disabled>Enviar Pedido</button>
</div>

<!-- Modal Itens -->
<div class="modal fade" id="modalItens" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCategoriaTitulo">Itens</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="listaItens" class="d-flex flex-column gap-2"></div>

                <div class="mt-3">
                    <h6>Extras / Subitens:</h6>
                    <div id="subitens-container" class="d-flex flex-column gap-1"></div>
                </div>

                <div class="mt-3">
                    <textarea class="form-control" id="itemObservacao" placeholder="Observações"></textarea>
                </div>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <button class="btn btn-success" id="btnLancarItem">Lançar Item</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* Comportamento:
   - Abrir Mesa: não cria nada no banco. Verifica se já existe pedido aberto (GET pedido_aberto).
   - Lançar Item: armazena localmente (pedidoAtual, itensNovos).
   - Enviar Pedido: chama enviar_pedido -> cria mesa/pedido no servidor.
*/

let mesaAtual = null;
let pedidoAtual = [];    // todos os itens exibidos no resumo (itens antigos + novos)
let pedidoId = null;
let categoriaSelecionada = null;
let itemSelecionado = null;
let itensNovos = [];     // só itens adicionados nesta sessão antes de enviar

// DOM
const inputMesa = document.getElementById("inputMesa");
const btnAbrirMesa = document.getElementById("btnAbrirMesa");
const btnLimparMesa = document.getElementById("btnLimparMesa");
const categoriasContainer = document.getElementById("categorias-container");
const pedidoDiv = document.getElementById("pedido-resumo");
const btnEnviarPedido = document.getElementById("btnEnviarPedido");

const modalItensEl = document.getElementById("modalItens");
const modalItens = new bootstrap.Modal(modalItensEl);
const listaItens = document.getElementById("listaItens");
const itemObservacao = document.getElementById("itemObservacao");
const btnLancarItem = document.getElementById("btnLancarItem");

// CSRF helper
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Atualiza a área de resumo (itens + total)
function atualizarResumo() {
    pedidoDiv.innerHTML = "";
    if (pedidoAtual.length === 0) {
        pedidoDiv.innerHTML = "<p>Pedido vazio</p>";
        btnEnviarPedido.disabled = true;
        return;
    }

    pedidoAtual.forEach(i => {
        const div = document.createElement("div");
        // usar "valor" como propriedade consistente
        const valor = (i.valor !== undefined) ? i.valor : (i.preco !== undefined ? i.preco : 0);
        div.textContent = `${i.nome} x${i.qtd || 1} - R$ ${(valor * (i.qtd || 1)).toFixed(2)} ${i.observacao ? `(${i.observacao})` : ""}`;
        pedidoDiv.appendChild(div);
    });

    const total = pedidoAtual.reduce((acc, i) => {
        const v = (i.valor !== undefined) ? i.valor : (i.preco !== undefined ? i.preco : 0);
        return acc + v * (i.qtd || 1);
    }, 0);

    const totalDiv = document.createElement("div");
    totalDiv.className = "fw-bold mt-2";
    totalDiv.textContent = `Total: R$ ${total.toFixed(2)}`;
    pedidoDiv.appendChild(totalDiv);

    // habilita enviar apenas se houver itens novos a enviar
    btnEnviarPedido.disabled = itensNovos.length === 0;
}

// Limpar campo mesa / estado local
btnLimparMesa.onclick = () => {
    inputMesa.value = "";
    mesaAtual = null;
    pedidoAtual = [];
    itensNovos = [];
    pedidoId = null;
    atualizarResumo();
    categoriasContainer.innerHTML = "";
    listaItens.innerHTML = "";
};

// Ao clicar "Abrir Mesa" — NÃO criar mesa: só verificar pedido aberto e carregar categorias
btnAbrirMesa.onclick = async () => {
    const numero = inputMesa.value && inputMesa.value.trim();
    if (!numero) { alert("Digite o número da mesa!"); return; }
    mesaAtual = numero;

    // 1) verificar se já existe pedido aberto (rota pedido_aberto/<mesa_num>/)
    try {
        const check = await fetch(`/funcionarios/api/pedido_aberto/${encodeURIComponent(mesaAtual)}/`);
        if (!check.ok) {
            // Se endpoint inexistente/err, só seguimos com a interface localmente
            console.warn("pedido_aberto retornou erro ou não disponível");
            pedidoAtual = [];
            pedidoId = null;
        } else {
            const checkData = await check.json();
            if (checkData && checkData.pedido_id) {
                // carregar pedido existente no resumo (não criar nada)
                pedidoId = checkData.pedido_id;
                pedidoAtual = checkData.itens || [];
            } else {
                // sem pedido aberto: estado local limpo
                pedidoAtual = [];
                pedidoId = null;
            }
        }
    } catch (e) {
        console.error("Erro ao verificar pedido_aberto:", e);
        pedidoAtual = [];
        pedidoId = null;
    }

    // reset itens novos (vai começar a adicionar localmente)
    itensNovos = [];
    atualizarResumo();

    // 2) buscar categorias (sempre)
    try {
        const catRes = await fetch("/funcionarios/api/listar_categorias/");
        if (catRes.ok) {
            const catData = await catRes.json();
            ativarCategorias(catData.categorias || []);
        } else {
            alert("Erro ao buscar categorias");
        }
    } catch (e) {
        console.error(e);
        alert("Erro ao buscar categorias");
    }
};

// renderiza botões de categorias
function ativarCategorias(categorias) {
    categoriasContainer.innerHTML = "";
    categorias.forEach(cat => {
        const btn = document.createElement("button");
        btn.textContent = cat.nome;
        btn.className = "btn btn-primary flex-grow-1";
        btn.onclick = () => abrirCategoria(cat.id, cat.nome);
        categoriasContainer.appendChild(btn);
    });
}

// Abrir categoria: pede itens + subcategorias (sua view já devolve itens e subcategorias)
async function abrirCategoria(categoriaId, nome) {
    categoriaSelecionada = categoriaId;
    try {
        const res = await fetch(`/funcionarios/api/listar_itens/${categoriaId}/`);
        if (!res.ok) { alert("Erro ao buscar itens da categoria!"); return; }
        const data = await res.json(); // data: { itens: [...], subcategorias: [...] } ou array/similar (suas views têm variação)
        listaItens.innerHTML = "";

        // algumas versões do seu view retornam objetos com chaves 'itens'/'subcategorias'
        const itensPrincipais = data.itens || data; // se for return JsonResponse(itens, safe=False) -> data é array
        if (Array.isArray(itensPrincipais)) {
            itensPrincipais.forEach(item => {
                const valor = item.valor !== undefined ? item.valor : (item.preco !== undefined ? item.preco : 0);
                const div = document.createElement("div");
                div.className = "item p-2 border rounded";
                div.textContent = `${item.nome} - R$ ${Number(valor).toFixed(2)}`;
                div.onclick = () => selecionarItem(div, item);
                listaItens.appendChild(div);
            });
        }

        // subcategorias quando presentes (sua view forneceu subcategorias)
        if (data.subcategorias && Array.isArray(data.subcategorias)) {
            data.subcategorias.forEach(sub => {
                const title = document.createElement("div");
                title.className = "fw-bold mt-2";
                title.textContent = sub.tipo || "Subitens";
                listaItens.appendChild(title);

                (sub.itens || []).forEach(item => {
                    const valor = item.valor !== undefined ? item.valor : (item.preco !== undefined ? item.preco : 0);
                    const div = document.createElement("div");
                    div.className = "item p-2 border rounded";
                    div.textContent = `${item.nome} - R$ ${Number(valor).toFixed(2)}`;
                    div.onclick = () => selecionarItem(div, item);
                    listaItens.appendChild(div);
                });
            });
        }

        // limpar seleção/observação
        itemObservacao.value = "";
        itemSelecionado = null;
        modalItens.show();
    } catch (e) {
        console.error(e);
        alert("Erro ao abrir categoria");
    }
}

// Seleciona item na lista modal
function selecionarItem(div, item) {
    listaItens.querySelectorAll(".item").forEach(i => i.classList.remove("bg-success"));
    div.classList.add("bg-success");
    // normalizar nome/valor/qtd
    const valor = item.valor !== undefined ? item.valor : (item.preco !== undefined ? item.preco : 0);
    itemSelecionado = { nome: item.nome, valor: Number(valor), qtd: 1, observacao: itemObservacao.value, origem_id: item.id };
}

// Lançar item (só local)
btnLancarItem.onclick = () => {
    if (!itemSelecionado) { alert("Selecione um item!"); return; }
    itemSelecionado.observacao = itemObservacao.value;
    // adiciona ao resumo local
    pedidoAtual.push({...itemSelecionado});
    // marca como novo — será enviado no envio final
    itensNovos.push({...itemSelecionado});
    atualizarResumo();
    modalItens.hide();
};

// Enviar pedido — AQUI se cria a mesa e o pedido no backend
btnEnviarPedido.onclick = async () => {
    if (!mesaAtual || itensNovos.length === 0) { alert("Mesa ou itens inválidos!"); return; }

    try {
        const res = await fetch("/funcionarios/api/enviar_pedido/", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
            body: JSON.stringify({ mesa: mesaAtual, itens: itensNovos })
        });

        const data = await res.json();
        if (res.ok && data.ok) {
            alert("Pedido enviado com sucesso!");
            // limpar estado local
            itensNovos = [];
            pedidoAtual = [];
            pedidoId = data.pedido_id || null;
            atualizarResumo();
            categoriasContainer.innerHTML = "";
            listaItens.innerHTML = "";
            inputMesa.value = "";
            mesaAtual = null;
        } else {
            alert("Erro ao enviar pedido: " + (data.erro || JSON.stringify(data)));
            console.error("enviar_pedido retornou:", data);
        }
    } catch (e) {
        console.error("Erro enviar_pedido:", e);
        alert("Erro ao enviar pedido (ver console).");
    }
};
</script>
</body>
</html>
