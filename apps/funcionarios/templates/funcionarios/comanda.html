{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Comanda - Garçom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/main.css' %}" type="text/css" rel="stylesheet"/>
</head>
<body>
<div id="func-comanda" class="container">
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom">
        <div>
            <h1 class="mb-0">Comanda - {{ request.user.get_full_name|default:request.user.username }}</h1>
        </div>
        <div>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-secondary">Sair</button>
            </form>
        </div>
    </header>

    <!-- Mesa -->
    <div class="my-3 d-flex flex-column flex-sm-row align-items-stretch gap-2">
        <input type="number" class="form-control flex-grow-1" id="inputMesa" placeholder="Número da Mesa">
        <div class="d-flex gap-2">
            <button class="btn btn-secondary flex-grow-1" id="btnLimparMesa">Limpar</button>
            <button class="btn btn-success flex-grow-1" id="btnAbrirMesa">Abrir Mesa</button>
        </div>
    </div>

    <!-- Categorias -->
    <div id="func-categorias" class="mb-3 d-flex flex-wrap gap-2"></div>

    <!-- Espaço onde opcionalmente pode renderizar itens inline se desejar -->
    <div id="lista-itens-container"></div>
</div>

<!-- Resumo fixo -->
<div id="pedido-resumo-fixo" class="p-3 border-top">
    <div id="pedido-resumo"><p>Pedido vazio</p></div>
    <button class="btn btn-primary w-100 mt-2" id="btnEnviarPedido" disabled>Enviar Pedido</button>
</div>

<!-- Modal Itens -->
<div class="modal fade" id="modalItens" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Selecionar Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div id="listaItens" class="d-flex flex-column gap-2 mb-3"></div>

                <div id="subitens-wrapper" class="mb-3">
                    <!-- subcategorias serão inseridas aqui -->
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <small class="text-muted">Quantidade</small>
                        <div id="global-spinner" class="func-spinner mt-1">
                            <button type="button" class="btn btn-outline-secondary btn-decrease">−</button>
                            <input type="number" min="1" value="1" class="form-control form-control-sm"
                                   id="inputQuantidade" style="width:70px;">
                            <button type="button" class="btn btn-outline-secondary btn-increase">+</button>
                        </div>
                    </div>
                    <div class="text-end">
                        <div class="text-muted">Valor unitário</div>
                        <div id="modal-valor" class="func-price-summary">R$ 0,00</div>
                    </div>
                </div>

                <div class="mt-3">
                    <textarea class="form-control" id="itemObservacao" placeholder="Observações"></textarea>
                </div>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <button class="btn btn-success" id="btnLancarItem">Lançar Item</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    (() => {
        let mesaAtual = null;
        let pedidoAtual = [];
        let pedidoId = null;
        let itensNovos = [];
        let selectedMain = null;
        let modalInstance = null;

        // --- Novos estados para pizza meia a meia ---
        let pizzaHalf = null;  // null / 'first' / 'second'
        let firstHalf = null;  // guarda o primeiro sabor selecionado

        const inputMesa = document.getElementById('inputMesa');
        const btnAbrirMesa = document.getElementById('btnAbrirMesa');
        const btnLimparMesa = document.getElementById('btnLimparMesa');
        const categoriasContainer = document.getElementById('func-categorias');
        const pedidoDiv = document.getElementById('pedido-resumo');
        const btnEnviarPedido = document.getElementById('btnEnviarPedido');

        const modalEl = document.getElementById('modalItens');
        modalInstance = new bootstrap.Modal(modalEl);
        const listaItens = document.getElementById('listaItens');
        const subitensWrapper = document.getElementById('subitens-wrapper');
        const inputQuantidade = document.getElementById('inputQuantidade');
        const btnIncrease = modalEl.querySelector('.btn-increase');
        const btnDecrease = modalEl.querySelector('.btn-decrease');
        const modalValor = document.getElementById('modal-valor');
        const itemObservacao = document.getElementById('itemObservacao');
        const btnLancarItem = document.getElementById('btnLancarItem');

        // --- Input para busca de sabores ---
        const inputBuscaSabor = document.createElement('input');
        inputBuscaSabor.type = 'text';
        inputBuscaSabor.id = 'inputBuscaSabor';
        inputBuscaSabor.className = 'form-control mb-2';
        inputBuscaSabor.placeholder = 'Buscar sabor...';
        modalEl.querySelector('.modal-body').insertBefore(inputBuscaSabor, listaItens);

        inputBuscaSabor.addEventListener('input', () => {
            const termo = inputBuscaSabor.value.toLowerCase();
            listaItens.querySelectorAll('.func-item-row').forEach(row => {
                const nome = row.querySelector('.fw-bold').textContent.toLowerCase();
                row.style.display = nome.includes(termo) ? '' : 'none';
            });
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function money(v) { return 'R$ ' + Number(v).toFixed(2).replace('.', ','); }
        function getItemPriceField(item) { return (item.valor !== undefined) ? Number(item.valor) : ((item.preco !== undefined) ? Number(item.preco) : 0); }

        function atualizarResumo() {
            pedidoDiv.innerHTML = '';
            if (!pedidoAtual.length) { pedidoDiv.innerHTML = '<p>Pedido vazio</p>'; btnEnviarPedido.disabled = true; return; }
            pedidoAtual.forEach(it => {
                const row = document.createElement('div');
                const qtd = it.qtd || 1;
                const valorUnit = Number(it.valor || it.preco || 0);
                row.textContent = `${it.nome} x${qtd} - ${money(valorUnit * qtd)}`;
                pedidoDiv.appendChild(row);
            });
            const total = pedidoAtual.reduce((acc, it) => acc + (Number(it.valor || it.preco || 0) * (it.qtd || 1)), 0);
            const totalDiv = document.createElement('div'); totalDiv.className = 'fw-bold mt-2'; totalDiv.textContent = `Total: ${money(total)}`;
            pedidoDiv.appendChild(totalDiv);
            btnEnviarPedido.disabled = itensNovos.length === 0;
        }

        btnLimparMesa.addEventListener('click', () => {
            inputMesa.value = ''; mesaAtual = null; pedidoAtual = []; itensNovos = []; pedidoId = null; selectedMain = null; pizzaHalf = null; firstHalf = null;
            atualizarResumo(); categoriasContainer.innerHTML = ''; listaItens.innerHTML = ''; subitensWrapper.innerHTML = '';
        });

        btnAbrirMesa.addEventListener('click', async () => {
            const numero = String(inputMesa.value || '').trim();
            if (!numero) { alert('Digite o número da mesa!'); return; }
            mesaAtual = numero;

            try {
                const res = await fetch(`/funcionarios/api/pedido_aberto/${encodeURIComponent(mesaAtual)}/`);
                if (res.ok) {
                    const data = await res.json();
                    pedidoId = data?.pedido_id || null;
                    pedidoAtual = data?.itens || [];
                } else { pedidoAtual = []; pedidoId = null; }
            } catch (e) { console.warn('pedido_aberto erro', e); pedidoAtual = []; pedidoId = null; }
            itensNovos = [];
            atualizarResumo();

            try {
                const catRes = await fetch('/funcionarios/api/listar_categorias/');
                if (!catRes.ok) throw new Error('Erro listar categorias');
                const cdata = await catRes.json();
                ativarCategorias(cdata.categorias || []);
            } catch (e) { console.error(e); alert('Erro ao carregar categorias'); }
        });

        function ativarCategorias(categorias) {
            categoriasContainer.innerHTML = '';
            categorias.forEach(cat => {
                const btn = document.createElement('button');
                btn.type = 'button'; btn.className = 'btn btn-primary'; btn.textContent = cat.nome;
                btn.addEventListener('click', () => abrirCategoria(cat.id, cat.nome));
                categoriasContainer.appendChild(btn);
            });
        }

        async function abrirCategoria(categoriaId, nome) {
            try {
                const res = await fetch(`/funcionarios/api/listar_itens/${categoriaId}/`);
                if (!res.ok) { alert('Erro ao buscar itens da categoria'); return; }
                const data = await res.json();
                const itensPrincipais = Array.isArray(data.itens) ? data.itens : data;
                const subcategorias = data.subcategorias || [];

                listaItens.innerHTML = ''; subitensWrapper.innerHTML = ''; selectedMain = null; inputQuantidade.value = 1; itemObservacao.value = ''; modalValor.textContent = money(0);
                inputBuscaSabor.value = '';

                // Só ativa meia a meia para categoria "Pizza"
                pizzaHalf = (nome.toLowerCase() === 'pizza') ? 'first' : null;
                firstHalf = null;
                atualizarTituloModal();

                itensPrincipais.forEach((it, idx) => {
                    const row = document.createElement('label'); row.className = 'func-item-row'; row.setAttribute('data-id', it.id);
                    row.innerHTML = `
                        <div class="d-flex align-items-center gap-3">
                            <input type="radio" name="func-main-item" class="form-check-input me-2 func-main-radio" data-idx="${idx}">
                            <div><div class="fw-bold">${it.nome}</div><div class="text-muted small">${money(getItemPriceField(it))}</div></div>
                        </div>
                        <div class="func-spinner">
                            <button type="button" class="btn btn-outline-secondary decrease-mini">−</button>
                            <input type="number" min="1" value="1" class="form-control form-control-sm qty-mini" style="width:70px">
                            <button type="button" class="btn btn-outline-secondary increase-mini">+</button>
                        </div>
                    `;

                    row.addEventListener('click', (ev) => {
                        const target = ev.target;
                        if (target.classList.contains('increase-mini') || target.classList.contains('decrease-mini') || target.classList.contains('qty-mini')) return;

                        const radio = row.querySelector('.func-main-radio'); radio.checked = true;

                        // --- Fluxo pizza meia a meia ---
                        if (pizzaHalf) {
                            if (pizzaHalf === 'first') {
                                firstHalf = it;
                                pizzaHalf = 'second';
                                atualizarTituloModal();
                            } else if (pizzaHalf === 'second') {
                                const pizzaComposta = {
                                    origem_id: null,
                                    nome: `${firstHalf.nome} / ${it.nome}`,
                                    qtd: Number(inputQuantidade.value || 1),
                                    valor: (getItemPriceField(firstHalf) + getItemPriceField(it)) / 2,
                                    observacao: itemObservacao.value.trim(),
                                    sabores: [firstHalf, it]
                                };
                                pedidoAtual.push(pizzaComposta);
                                itensNovos.push(pizzaComposta);
                                modalInstance.hide();
                                pizzaHalf = null; firstHalf = null;
                                atualizarResumo();
                            }
                            return;
                        }
                        // --- Fluxo normal ---
                        onMainSelected(it, row);
                    });

                    const inputMini = row.querySelector('.qty-mini');
                    row.querySelector('.increase-mini').addEventListener('click', e => { e.stopPropagation(); inputMini.value = Number(inputMini.value) + 1; });
                    row.querySelector('.decrease-mini').addEventListener('click', e => { e.stopPropagation(); if (inputMini.value > 1) inputMini.value = Number(inputMini.value) - 1; });

                    listaItens.appendChild(row);
                });

                modalInstance.show();
            } catch (e) { console.error(e); alert('Erro ao abrir categoria'); }
        }

        function atualizarTituloModal() {
            const titulo = modalEl.querySelector('.modal-title');
            if (pizzaHalf === 'first') titulo.textContent = 'Primeira metade da Pizza';
            else if (pizzaHalf === 'second') titulo.textContent = 'Segunda metade da Pizza';
            else titulo.textContent = 'Selecionar Item';
        }

        function onMainSelected(item, row) {
            selectedMain = item;
            modalValor.textContent = money(getItemPriceField(item) * Number(inputQuantidade.value || 1));
        }

        btnIncrease.addEventListener('click', () => { inputQuantidade.value = Number(inputQuantidade.value || 1) + 1; if (selectedMain) onMainSelected(selectedMain); });
        btnDecrease.addEventListener('click', () => { if (inputQuantidade.value > 1) inputQuantidade.value = Number(inputQuantidade.value) - 1; if (selectedMain) onMainSelected(selectedMain); });

        btnLancarItem.addEventListener('click', () => {
            if (!selectedMain) { alert('Selecione um item'); return; }
            const novoItem = {
                origem_id: selectedMain.id,
                nome: selectedMain.nome,
                qtd: Number(inputQuantidade.value || 1),
                valor: getItemPriceField(selectedMain),
                observacao: itemObservacao.value.trim()
            };
            pedidoAtual.push(novoItem);
            itensNovos.push(novoItem);
            modalInstance.hide();
            atualizarResumo();
        });

    })();
</script>
</body>
</html>
