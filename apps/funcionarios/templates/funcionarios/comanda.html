<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Comanda - Garçom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .item-card { cursor: pointer; }
        .item-card.selected { background-color: #d1e7dd; }
        .item { cursor: pointer; }
        .item.bg-success { background-color: #198754 !important; color: white; }
    </style>
</head>
<body class="p-3">
<div class="container">
    <h1>Comanda - Garçom</h1>

    <!-- Mesa -->
    <div class="mb-3">
        <label for="inputMesa" class="form-label">Número da Mesa</label>
        <input type="number" class="form-control" id="inputMesa">
    </div>
    <button class="btn btn-success mb-3" id="btnAbrirMesa">Abrir Mesa</button>

    <!-- Categoria -->
    <div id="categorias-container" class="mb-3"></div>

    <!-- Resumo do pedido -->
    <div id="pedido-resumo" class="mb-3"><p>Pedido vazio</p></div>

    <!-- Botão Enviar Pedido -->
    <button class="btn btn-primary" id="btnEnviarPedido" disabled>Enviar Pedido</button>
</div>

<!-- Modal Itens -->
<div class="modal fade" id="modalItens" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCategoriaTitulo">Itens</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="listaItens"></div>
                <div class="mt-3">
                    <textarea class="form-control" id="itemObservacao" placeholder="Observações"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" id="btnLancarItem">Lançar Item</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // -----------------------------
    // Variáveis
    // -----------------------------
    let mesaAtual = null;
    let pedidoAtual = [];
    let pedidoId = null;
    let categoriaSelecionada = null;
    let itemSelecionado = null;

    // Elementos
    const btnAbrirMesa = document.getElementById("btnAbrirMesa");
    const inputMesa = document.getElementById("inputMesa");
    const categoriasContainer = document.getElementById("categorias-container");
    const pedidoDiv = document.getElementById("pedido-resumo");
    const btnEnviarPedido = document.getElementById("btnEnviarPedido");

    const modalItens = new bootstrap.Modal(document.getElementById("modalItens"));
    const listaItens = document.getElementById("listaItens");
    const itemObservacao = document.getElementById("itemObservacao");
    const btnLancarItem = document.getElementById("btnLancarItem");

    // -----------------------------
    // Função CSRF
    // -----------------------------
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(";");
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + "=")) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // -----------------------------
    // Desativar categorias
    // -----------------------------
    function desativarCategorias() {
        categoriasContainer.innerHTML = "";
    }

    // -----------------------------
    // Atualizar resumo do pedido
    // -----------------------------
    function atualizarResumo() {
        if (pedidoAtual.length === 0) {
            pedidoDiv.innerHTML = "<p>Pedido vazio</p>";
            btnEnviarPedido.disabled = true;
            return;
        }
        pedidoDiv.innerHTML = "";
        pedidoAtual.forEach((i) => {
            const div = document.createElement("div");
            div.textContent = `${i.nome} x${i.qtd} - R$ ${(i.valor * i.qtd).toFixed(2)} ${i.observacao ? `(${i.observacao})` : ""}`;
            pedidoDiv.appendChild(div);
        });

        const total = pedidoAtual.reduce((acc, i) => acc + i.valor * i.qtd, 0);
        const totalDiv = document.createElement("div");
        totalDiv.className = "fw-bold mt-2";
        totalDiv.textContent = `Total: R$ ${total.toFixed(2)}`;
        pedidoDiv.appendChild(totalDiv);

        btnEnviarPedido.disabled = false;
    }

    // -----------------------------
    // Abrir mesa
    // -----------------------------
    btnAbrirMesa.onclick = async () => {
        const numero = inputMesa.value;
        if (!numero) {
            alert("Digite o número da mesa!");
            return;
        }
        mesaAtual = numero;

        // Abrir ou criar pedido
        const res = await fetch("/funcionarios/api/abrir_mesa/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie("csrftoken")
            },
            body: JSON.stringify({ mesa: mesaAtual })
        });

        if (!res.ok) {
            alert("Erro ao abrir mesa!");
            return;
        }

        const data = await res.json();
        pedidoId = data.pedido_id;
        pedidoAtual = data.itens || [];

        atualizarResumo();

        // Buscar categorias
        const catRes = await fetch("/funcionarios/api/listar_categorias/");
        const catData = await catRes.json();
        ativarCategorias(catData.categorias);
    };

    // -----------------------------
    // Ativar categorias
    // -----------------------------
    function ativarCategorias(categorias) {
        categoriasContainer.innerHTML = "";
        categorias.forEach(cat => {
            const btn = document.createElement("button");
            btn.textContent = cat.nome;
            btn.className = "btn btn-primary me-2 mb-2";
            btn.onclick = () => abrirCategoria(cat.id, cat.nome);
            categoriasContainer.appendChild(btn);
        });
    }

    // -----------------------------
    // Abrir categoria e modal de itens
    // -----------------------------
    async function abrirCategoria(categoriaId, nome) {
        categoriaSelecionada = categoriaId;

        const res = await fetch(`/funcionarios/api/listar_itens/${categoriaId}/`);
        if (!res.ok) {
            alert("Erro ao buscar itens da categoria!");
            return;
        }
        const data = await res.json();

        listaItens.innerHTML = "";
        data.forEach(item => {
            const div = document.createElement("div");
            div.className = "item d-flex justify-content-between p-2 mb-1 border";
            div.textContent = `${item.nome} - R$ ${item.valor.toFixed(2)}`;
            div.onclick = () => selecionarItem(div, item);
            listaItens.appendChild(div);
        });

        itemObservacao.value = "";
        itemSelecionado = null;
        modalItens.show();
    }

    // -----------------------------
    // Selecionar item
    // -----------------------------
    function selecionarItem(div, item) {
        const itens = listaItens.querySelectorAll(".item");
        itens.forEach(i => i.classList.remove("bg-success"));

        div.classList.add("bg-success");
        itemSelecionado = { ...item, qtd: 1, observacao: itemObservacao.value };
    }

    // -----------------------------
    // Lançar item no pedido
    // -----------------------------
    btnLancarItem.onclick = async () => {
        if (!itemSelecionado) {
            alert("Selecione um item!");
            return;
        }

        itemSelecionado.observacao = itemObservacao.value;
        pedidoAtual.push(itemSelecionado);
        atualizarResumo();

        // Salvar via API
        await fetch("/funcionarios/api/adicionar_item/", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
            body: JSON.stringify({ mesa: mesaAtual, item: itemSelecionado })
        });

        modalItens.hide();
    };

    // -----------------------------
    // Enviar pedido
    // -----------------------------
    btnEnviarPedido.onclick = async () => {
        if (!mesaAtual || pedidoAtual.length === 0) {
            alert("Mesa ou itens inválidos!");
            return;
        }

        const res = await fetch("/funcionarios/api/enviar_pedido/", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
            body: JSON.stringify({ mesa: mesaAtual, itens: pedidoAtual })
        });

        const data = await res.json();
        if (data.ok) {
            alert("Pedido enviado com sucesso!");
            mesaAtual = null;
            pedidoAtual = [];
            pedidoId = null;
            categoriaSelecionada = null;
            desativarCategorias();
            atualizarResumo();
            inputMesa.value = "";
        } else {
            alert("Erro ao enviar pedido: " + data.erro);
        }
    };
</script>

</body>
</html>
