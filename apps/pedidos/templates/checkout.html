{% load static %}
{% load pictures %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Tião Hamburgueria</title>

    <!-- Custon CSS -->
    <link rel="stylesheet" href="{% static 'css/custon2.css' %}">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min2.css' %}">
    <!-- Icon -->
    <link rel="stylesheet" href="{% static 'fonts/line-icons.css' %}">
    <!-- Owl carousel -->
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min2.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.theme2.css' %}">

    <!-- Animate -->
    <link rel="stylesheet" href="{% static 'css/animate2.css' %}">
    <!-- Main Style -->
    <link rel="stylesheet" href="{% static 'css/main2.css' %}">
    <!-- Responsive Style -->
    <link rel="stylesheet" href="{% static 'css/responsive2.css' %}">

</head>
<body>

<!-- Header Area wrapper Starts -->
<header id="header-wrap">
    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-md bg-inverse fixed-top scrolling-navbar">
        <div class="container">
            <!-- Brand and toggle get grouped for better mobile display -->
            <a href="{% url 'clientes:index' %}" class="navbar-brand"><img src="{% static 'img/logo.png' %}" alt=""></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse"
                    aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <i class="lni-menu"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav mr-auto w-100 justify-content-end clearfix">
                    <li class="nav-item">
                        <a href="{% url 'clientes:index' %}" class="nav-link">
                            Home
                        </a>
                    <li class="nav-item">
                        <a href="{% url 'pedidos:cardapio' %}" class="nav-link">
                            Cardápio
                        </a>
                    </li>
                    </li>
                    <li class="nav-item">
                        <a id="linkSacola" href="{% url 'pedidos:checkout' %}" class="nav-link">
                            Sacola
                            <i class="lni-cart"></i>
                            <span id="contadorSacola" class="badge badge-danger position-absolute"
                                  style="top:0; right:0;">0</span>
                        </a>

                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

{%block content%}
<div class="container my-4">
    <h2 class="head-title mb-4 text-center">Sua Sacola</h2>


    <!-- Lista de pedidos -->
    <div id="listaPedidos" class="mb-3"></div>

    <!-- Botões de ação -->
    <div class="mb-3 d-flex justify-content-between">
        <button id="btnLimparCarrinho" class="btn btn-danger">🗑️ Limpar Sacola</button>
    </div>

    <!-- Formulário do cliente -->
    <div class="card p-3 mb-3">
        <h5>Informações de Entrega</h5>
        <div class="form-group mb-2">
            <input type="text" id="clienteNome" class="form-control" placeholder="Nome">
        </div>
        <div class="form-group mb-2">
            <input type="text" id="clienteTelefone" class="form-control" placeholder="Telefone">
        </div>
        <div class="form-group mb-2">
            <select id="clientePagamento" class="form-control">
                <option value="">Forma de Pagamento</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Pix">Pix</option>
                <option value="Cartão">Cartão</option>
            </select>
        </div>
        <div class="form-group mb-2">
            <input type="text" id="clienteEndereco" class="form-control" placeholder="Endereço">
        </div>
        <div class="form-group mb-2">
            <textarea id="pedidoObservacao" class="form-control" placeholder="Ex: Bloco 01 - Ap 55, ponto de referência"
                      maxlength="140"></textarea>
            <small id="contadorObservacao" class="form-text text-muted">140 caracteres restantes</small>
        </div>
        <button id="btnEnviarWhatsApp" class="btn btn-success btn-block mt-2">📲 Enviar Pedido via WhatsApp</button>
    </div>
</div>


{% endblock %}

<div id="copyright">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="copyright-content">
                    <p>Copyright © 2025 <a rel="nofollow" href="{% url 'clientes:index' %}">Rafael Mateus</a> All Right
                        Reserved
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Go to Top Link -->
<a href="#" class="back-to-top">
    <i class="lni-arrow-up"></i>
</a>

<!-- Preloader -->
<div id="preloader">
    <div class="loader" id="loader-1"></div>
</div>
<!-- End Preloader -->

<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="{% static 'js/custon2.js' %}"></script>
<script src="{% static 'js/jquery-min2.js' %}"></script>
<script src="{% static 'js/popper.min2.js' %}"></script>
<script src="{% static 'js/bootstrap.min2.js' %}"></script>
<script src="{% static 'js/owl.carousel.min2.js' %}"></script>
<script src="{% static 'js/wow2.js' %}"></script>
<script src="{% static 'js/jquery.nav2.js' %}"></script>
<script src="{% static 'js/scrolling-nav2.js' %}"></script>
<script src="{% static 'js/jquery.easing.min2.js' %}"></script>
<script src="{% static 'js/main2.js' %}"></script>
<script src="{% static 'js/form-validator.min2.js' %}"></script>
<script src="{% static 'js/contact-form-script.min2.js' %}"></script>

</body>
</html>
